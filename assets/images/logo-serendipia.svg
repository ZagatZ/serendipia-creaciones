<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="serendipia-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="gold-needle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="serendipia-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo base suave -->
  <rect width="48" height="48" rx="14" fill="#131929" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Hebra de hilo formando una 'S' dinámica de Serendipia -->
  <path d="M14 16C14 12 18 10 24 10C30 10 33 13 33 17C33 22 25 23 23 26C21 29 21 34 26 34C31 34 34 32 35 29" 
        stroke="url(#serendipia-grad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#serendipia-glow)"/>

  <!-- Aguja de coser diagonal estilizada -->
  <line x1="33" y1="11" x2="15" y2="37" stroke="url(#gold-needle)" stroke-width="2" stroke-linecap="round"/>
  <!-- Ojo de la aguja -->
  <ellipse cx="32" cy="12.5" rx="1" ry="2" transform="rotate(45 32 12.5)" fill="#ffffff" />
  
  <!-- Destello de creatividad textil -->
  <path d="M36 21L37 19L39 18L37 17L36 15L35 17L33 18L35 19L36 21Z" fill="#38bdf8" />
</svg>
