<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#111c30" />
    </linearGradient>
    <pattern id="cadGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#cadBg)"/>
  <rect width="400" height="240" rx="16" fill="url(#cadGrid)"/>

  <!-- Ejes de centrado de bastidor -->
  <line x1="20" y1="120" x2="380" y2="120" stroke="rgba(255,255,255,0.15)" stroke-dasharray="4 4"/>
  <line x1="200" y1="20" x2="200" y2="220" stroke="rgba(255,255,255,0.15)" stroke-dasharray="4 4"/>

  <!-- Trazos de vectorización y picaje de nodos -->
  <g transform="translate(130, 45)">
    <!-- Letra 'S' en vector con nodos de control visibles -->
    <path d="M40 30 C40 10 70 10 100 10 C120 10 135 25 135 45 C135 70 80 80 80 95 C80 115 130 110 135 125 C140 140 115 150 85 150 C50 150 40 130 40 115" 
          stroke="#38bdf8" 
          stroke-width="3" 
          fill="none" 
          stroke-linecap="round"/>
    
    <!-- Puntadas de compensación / satin stitch -->
    <path d="M45 25 L55 35 M60 20 L70 30 M75 16 L85 26 M90 15 L100 25 M105 18 L115 28 M120 25 L128 35 M125 40 L132 50 M120 55 L128 65 M105 70 L115 80 M90 80 L100 90 M75 90 L85 100 M75 105 L85 115 M90 115 L100 125 M105 120 L115 130 M115 135 L122 145" 
          stroke="#f472b6" 
          stroke-width="1.8"/>

    <!-- Nodos de edición CAD (cuadraditos azules) -->
    <rect x="36" y="26" width="8" height="8" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
    <rect x="96" y="6" width="8" height="8" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
    <rect x="131" y="41" width="8" height="8" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
    <rect x="76" y="91" width="8" height="8" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
    <rect x="131" y="121" width="8" height="8" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
    <rect x="81" y="146" width="8" height="8" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Caja de datos de archivo matriz -->
  <rect x="20" y="20" width="130" height="42" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.3)"/>
  <text x="30" y="38" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">MATRIZ DIGITAL</text>
  <text x="30" y="51" fill="#94a3b8" font-family="monospace" font-size="9">.DST • .PES • .EMB</text>

  <!-- Tag de picaje profesional -->
  <g transform="translate(240, 190)">
    <rect width="140" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
    <text x="70" y="20" text-anchor="middle" fill="#7dd3fc" font-family="sans-serif" font-size="11" font-weight="700">Digitalización Wilcom</text>
  </g>
</svg>
