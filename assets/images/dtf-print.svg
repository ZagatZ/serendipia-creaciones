<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="dtfStudio" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e1b2e"/>
      <stop offset="60%" stop-color="#11131a"/>
      <stop offset="100%" stop-color="#07080d"/>
    </radialGradient>
    <linearGradient id="teeFabric" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="55%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="dtfArt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="38%" stop-color="#e33391"/>
      <stop offset="72%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#00b0d0"/>
    </linearGradient>
    <linearGradient id="filmSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00b0d0" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="dtfShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="400" height="260" fill="url(#dtfStudio)"/>

  <!-- Resplandor CMYK detrás de la prenda -->
  <ellipse cx="200" cy="132" rx="150" ry="95" fill="url(#dtfArt)" opacity="0.14"/>

  <!-- Polera de algodón oscuro con estampado DTF -->
  <g filter="url(#dtfShadow)">
    <!-- Silueta Polera -->
    <path d="M 136 36 C 154 28, 174 26, 200 26 C 226 26, 246 28, 264 36 L 322 68 L 302 114 L 270 98 V 232 C 242 238, 158 238, 130 232 V 98 L 98 114 L 78 68 Z"
          fill="url(#teeFabric)" stroke="#3f3f46" stroke-width="1.3" stroke-linejoin="round"/>

    <!-- Cuello Rib redondo -->
    <path d="M 166 30 C 180 48, 220 48, 234 30" fill="none" stroke="#52525b" stroke-width="5" stroke-linecap="round"/>
    <path d="M 170 29 C 184 44, 216 44, 230 29" fill="#09090b"/>

    <!-- Sombra suave de pliegues -->
    <path d="M 142 104 L 140 226" stroke="#ffffff" stroke-opacity="0.05" stroke-width="3"/>
    <path d="M 258 104 L 260 226" stroke="#000000" stroke-opacity="0.3" stroke-width="4"/>

    <!-- Gráfico DTF Full Color vibrante en el pecho -->
    <g transform="translate(144, 72)">
      <!-- Marco sutil del diseño -->
      <rect x="0" y="0" width="112" height="118" rx="12" fill="#09090b" stroke="url(#dtfArt)" stroke-width="1.8"/>

      <!-- Sol/Círculo degradado CMYK -->
      <circle cx="56" cy="46" r="28" fill="url(#dtfArt)"/>
      <!-- Montañas geométricas blancas de alto contraste (base blanca DTF) -->
      <path d="M 20 84 L 46 48 L 62 68 L 76 52 L 94 84 Z" fill="#ffffff" opacity="0.95"/>
      <path d="M 46 48 L 56 64 L 62 68 L 46 48 Z" fill="#e2e8f0"/>
      <!-- Destellos -->
      <circle cx="34" cy="24" r="2.2" fill="#fde047"/>
      <circle cx="84" cy="28" r="1.8" fill="#38bdf8"/>

      <!-- Tipografía limpia DTF -->
      <text x="56" y="103" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="900" fill="#ffffff" letter-spacing="2.2">FULL COLOR</text>

      <!-- Esquina de film DTF despegándose (efecto realista de transferencia) -->
      <path d="M 86 -4 L 116 -4 L 116 26 Z" fill="url(#filmSheen)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1"/>
      <path d="M 86 -4 Q 98 12, 116 26 L 88 22 Z" fill="#e2e8f0" opacity="0.22"/>
    </g>
  </g>

  <!-- Indicadores CMYK discretos -->
  <g transform="translate(180, 200)">
    <circle cx="0" cy="0" r="3.5" fill="#00b0d0"/>
    <circle cx="13" cy="0" r="3.5" fill="#e33391"/>
    <circle cx="26" cy="0" r="3.5" fill="#facc15"/>
    <circle cx="39" cy="0" r="3.5" fill="#ffffff"/>
  </g>
</svg>
