<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="shBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#132544"/>
      <stop offset="60%" stop-color="#0b1528"/>
      <stop offset="100%" stop-color="#060b16"/>
    </radialGradient>
    <linearGradient id="shFabric" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="shSleeve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <filter id="shShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="400" height="260" fill="url(#shBg)"/>
  <ellipse cx="200" cy="130" rx="155" ry="95" fill="#3b82f6" opacity="0.1"/>
  <ellipse cx="200" cy="240" rx="106" ry="8" fill="#000000" opacity="0.45"/>

  <!-- Polerón / Chaqueta de Buzo Escolar Institucional -->
  <g filter="url(#shShadow)">
    <!-- Manga Izquierda con franja deportiva -->
    <path d="M 134 52 C 110 60, 88 92, 74 178 L 98 184 C 110 136, 122 110, 136 102 Z"
          fill="url(#shSleeve)" stroke="#3b82f6" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M 122 60 C 102 82, 88 122, 80 176" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
    <path d="M 127 62 C 107 84, 93 124, 85 178" stroke="#ef4444" stroke-width="2.5" opacity="0.9"/>
    <!-- Puño Izquierdo -->
    <path d="M 74 178 L 98 184 L 95 196 C 86 196, 78 194, 72 190 Z" fill="#0f172a" stroke="#60a5fa" stroke-width="1"/>

    <!-- Manga Derecha con franja deportiva -->
    <path d="M 266 52 C 290 60, 312 92, 326 178 L 302 184 C 290 136, 278 110, 264 102 Z"
          fill="url(#shFabric)" stroke="#3b82f6" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M 278 60 C 298 82, 312 122, 320 176" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
    <path d="M 273 62 C 293 84, 307 124, 315 178" stroke="#ef4444" stroke-width="2.5" opacity="0.9"/>
    <!-- Puño Derecho -->
    <path d="M 326 178 L 302 184 L 305 196 C 314 196, 322 194, 328 190 Z" fill="#0f172a" stroke="#60a5fa" stroke-width="1"/>

    <!-- Cuerpo Principal -->
    <path d="M 134 52 C 156 42, 244 42, 266 52 L 264 218 C 240 224, 160 224, 136 218 Z"
          fill="url(#shFabric)" stroke="#3b82f6" stroke-width="1.3" stroke-linejoin="round"/>

    <!-- Cuello alto institucional con rib -->
    <path d="M 168 44 C 178 30, 222 30, 232 44 L 228 56 C 214 62, 186 62, 172 56 Z"
          fill="#0f172a" stroke="#60a5fa" stroke-width="1.3"/>
    <path d="M 173 43 C 188 49, 212 49, 227 43" stroke="#ffffff" stroke-width="1.6" opacity="0.85"/>

    <!-- Cierre central sutil -->
    <line x1="200" y1="54" x2="200" y2="220" stroke="#93c5fd" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="197.5" y="64" width="5" height="9" rx="2" fill="#e2e8f0"/>

    <!-- Franjas horizontales institucionales en pecho -->
    <rect x="136.5" y="132" width="127" height="7" fill="#ef4444"/>
    <rect x="136.5" y="140" width="127" height="3.5" fill="#ffffff"/>

    <!-- Escudo Institucional Bordado (Pecho Izquierdo del usuario / derecha visual) -->
    <g transform="translate(228, 86)">
      <path d="M 0 -14 L 13 -9 V 4 C 13 13, 0 19, 0 19 C 0 19, -13 13, -13 4 V -9 Z"
            fill="#fbbf24" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M 0 -9 L 8 -5.5 V 3 C 8 9, 0 13, 0 13 C 0 13, -8 9, -8 3 V -5.5 Z"
            fill="#1e3a8a"/>
      <path d="M -4 2 L 0 -3 L 4 2 L 0 7 Z" fill="#fde047"/>
    </g>

    <!-- Bolsillos laterales -->
    <line x1="150" y1="168" x2="162" y2="196" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
    <line x1="250" y1="168" x2="238" y2="196" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>

    <!-- Pretina inferior rib -->
    <path d="M 136 214 C 160 220, 240 220, 264 214 L 263 228 C 240 234, 160 234, 137 228 Z"
          fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
  </g>
</svg>
