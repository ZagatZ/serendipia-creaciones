<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="hoodieBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091b29" />
      <stop offset="100%" stop-color="#0f293d" />
    </linearGradient>
    <linearGradient id="hoodieFabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
  </defs>

  <rect width="400" height="260" rx="16" fill="url(#hoodieBg)"/>

  <!-- Buzo Escolar Franela de Algodón con Costura Reforzada -->
  <g transform="translate(110, 25)">
    <!-- Cuerpo y mangas del buzo -->
    <path d="M45 40 L10 75 L30 115 L50 95 V195 H130 V95 L150 115 L170 75 L135 40 Q90 55 45 40 Z" 
          fill="url(#hoodieFabric)" 
          stroke="#3b82f6" 
          stroke-width="2"/>
    
    <!-- Cuello redondo con rib elástico -->
    <path d="M60 40 Q90 60 120 40 Q90 50 60 40 Z" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.5"/>

    <!-- Costuras dobles reforzadas en hombros y sisas -->
    <path d="M45 43 L10 77 M48 47 L15 80" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3 2"/>
    <path d="M135 43 L170 77 M132 47 L165 80" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3 2"/>
    
    <!-- Cintura y puños con ribbing elástico -->
    <rect x="50" y="185" width="80" height="10" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1"/>
    
    <!-- Escudo del colegio bordado en el pecho izquierdo -->
    <rect x="65" y="70" width="22" height="26" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    <path d="M71 78 H81 M71 83 H81 M76 75 V88" stroke="#b45309" stroke-width="1.2"/>

    <!-- Detalle de vivos combinados institucionales -->
    <line x1="50" y1="120" x2="130" y2="120" stroke="#ef4444" stroke-width="4"/>
    <line x1="50" y1="126" x2="130" y2="126" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Tag de terminaciones -->
  <rect x="20" y="20" width="135" height="42" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(59, 130, 246, 0.3)"/>
  <text x="30" y="38" fill="#60a5fa" font-family="monospace" font-size="10" font-weight="bold">BUZOS ESCOLARES</text>
  <text x="30" y="51" fill="#94a3b8" font-family="monospace" font-size="9">Franela Algodón • Antipilling</text>

  <!-- Sello de costuras -->
  <g transform="translate(250, 205)">
    <rect width="130" height="34" rx="17" fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="21" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="11" font-weight="600">Costura 5 Hilos</text>
  </g>
</svg>
