<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="jcStudio" cx="50%" cy="48%" r="62%">
      <stop offset="0%" stop-color="#271936"/>
      <stop offset="60%" stop-color="#111626"/>
      <stop offset="100%" stop-color="#070a12"/>
    </radialGradient>
    <linearGradient id="jcCrown" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="48%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="jcVisor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="jc3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#e33391"/>
      <stop offset="100%" stop-color="#00b0d0"/>
    </linearGradient>
    <filter id="jcShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="400" height="260" fill="url(#jcStudio)"/>
  <ellipse cx="200" cy="135" rx="155" ry="90" fill="#e33391" opacity="0.14"/>
  <ellipse cx="198" cy="214" rx="115" ry="12" fill="#000000" opacity="0.5"/>

  <!-- Jockey Estructurado 6 Paneles (Vista 3/4 Realista) -->
  <g filter="url(#jcShadow)" transform="translate(0, 8)">
    <!-- Botón superior forrado -->
    <ellipse cx="212" cy="54" rx="9" ry="5" fill="#475569" stroke="#64748b" stroke-width="1.2"/>

    <!-- Corona / Casquete 6 paneles -->
    <path d="M 116 154 C 110 88, 152 54, 212 54 C 272 54, 304 92, 300 156 C 266 168, 154 168, 116 154 Z"
          fill="url(#jcCrown)" stroke="#475569" stroke-width="1.5"/>

    <!-- Costuras estructuradas de paneles -->
    <path d="M 212 56 C 194 94, 188 128, 188 162" stroke="#64748b" stroke-opacity="0.55" stroke-width="1.3"/>
    <path d="M 212 56 C 242 86, 260 124, 264 160" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.3"/>
    <path d="M 212 56 C 166 78, 134 114, 124 154" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.3"/>

    <!-- Ojetillos bordados de ventilación -->
    <circle cx="158" cy="96" r="3.2" fill="#0f172a" stroke="#64748b" stroke-width="1.3"/>
    <circle cx="242" cy="88" r="3.2" fill="#0f172a" stroke="#64748b" stroke-width="1.3"/>
    <circle cx="276" cy="112" r="3" fill="#0f172a" stroke="#64748b" stroke-width="1.3"/>

    <!-- Visera curva en perspectiva 3/4 -->
    <path d="M 116 152 C 74 166, 70 184, 108 196 C 156 210, 224 202, 262 178 C 276 170, 286 162, 294 156 C 248 168, 158 168, 116 152 Z"
          fill="url(#jcVisor)" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Borde inferior sutil de la visera (acento marca) -->
    <path d="M 88 184 C 122 204, 198 206, 262 178" stroke="#e33391" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <!-- Pespuntes curvos en la visera -->
    <path d="M 102 174 C 142 190, 206 188, 258 168" stroke="#64748b" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="4 3"/>
    <path d="M 112 166 C 148 180, 208 178, 254 162" stroke="#64748b" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- Bordado Frontal 3D en Relieve -->
    <g transform="translate(154, 100)">
      <!-- Sombra de volumen 3D -->
      <path d="M 30 8 C 30 0, 10 0, 10 11 C 10 21, 30 20, 30 31 C 30 41, 8 41, 8 33"
            stroke="#000000" stroke-width="8" stroke-linecap="round" opacity="0.55" transform="translate(2, 4)"/>
      <!-- Puntada satinada 3D -->
      <path d="M 30 8 C 30 0, 10 0, 10 11 C 10 21, 30 20, 30 31 C 30 41, 8 41, 8 33"
            stroke="url(#jc3D)" stroke-width="7" stroke-linecap="round"/>
      <!-- Brillo hilo satinado -->
      <path d="M 28 7 C 28 2, 12 2, 12 11 C 12 19, 28 19, 28 30"
            stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Punto acento cyan -->
      <circle cx="38" cy="9" r="3.5" fill="#00b0d0"/>
    </g>
  </g>
</svg>
