<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="workwearBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141d1a" />
      <stop offset="100%" stop-color="#0b1b13" />
    </linearGradient>
    <linearGradient id="vestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
  </defs>

  <rect width="400" height="260" rx="16" fill="url(#workwearBg)"/>

  <!-- Chaleco / Chaqueta de trabajo industrial -->
  <g transform="translate(115, 25)">
    <!-- Silueta chaleco industrial -->
    <path d="M40 35 L15 50 L25 95 L40 85 V200 H130 V85 L145 95 L155 50 L130 35 L105 55 H65 L40 35 Z" 
          fill="url(#vestGrad)" 
          stroke="#22c55e" 
          stroke-width="2"/>
    
    <!-- Cierre central reforzado -->
    <line x1="85" y1="55" x2="85" y2="200" stroke="#f1f5f9" stroke-width="2.5" stroke-dasharray="4 2"/>
    
    <!-- Cinta reflectante de seguridad reglamentaria clase 2 -->
    <rect x="35" y="115" width="100" height="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <line x1="35" y1="122" x2="135" y2="122" stroke="#cbd5e1" stroke-width="2"/>

    <rect x="40" y="155" width="90" height="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <line x1="40" y1="162" x2="130" y2="162" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Bolsillos cargo con fuelle y costura de seguridad -->
    <rect x="42" y="145" width="34" height="42" rx="4" fill="#166534" stroke="#4ade80" stroke-width="1.2"/>
    <rect x="94" y="145" width="34" height="42" rx="4" fill="#166534" stroke="#4ade80" stroke-width="1.2"/>

    <!-- Porta credencial o bordado de empresa en el pecho -->
    <rect x="45" y="70" width="30" height="22" rx="3" fill="#0f172a" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="48" y1="76" x2="72" y2="76" stroke="#38bdf8" stroke-width="2"/>
    <line x1="48" y1="82" x2="68" y2="82" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- Tag de tela técnica -->
  <rect x="20" y="20" width="140" height="42" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(34, 197, 94, 0.3)"/>
  <text x="30" y="38" fill="#4ade80" font-family="monospace" font-size="10" font-weight="bold">ROPA DE TRABAJO</text>
  <text x="30" y="51" fill="#94a3b8" font-family="monospace" font-size="9">Grafa 70 • Cintas Reflectivas</text>

  <!-- Sello de durabilidad -->
  <g transform="translate(245, 205)">
    <rect width="135" height="34" rx="17" fill="rgba(34, 197, 94, 0.15)" stroke="#22c55e" stroke-width="1"/>
    <text x="67" y="21" text-anchor="middle" fill="#86efac" font-family="sans-serif" font-size="11" font-weight="600">Norma Seguridad</text>
  </g>
</svg>
