<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="reelGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="igGlow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f09433" />
      <stop offset="50%" stop-color="#dc2743" />
      <stop offset="100%" stop-color="#bc1888" />
    </linearGradient>
    <linearGradient id="neonDtf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
  </defs>

  <!-- Fondo Reel vertical -->
  <rect width="360" height="480" rx="16" fill="url(#reelGrad2)"/>
  
  <!-- Plancha térmica y transfer DTF -->
  <g transform="translate(60, 110)">
    <!-- Base de la plancha térmica -->
    <rect x="10" y="140" width="220" height="30" rx="6" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <rect x="25" y="110" width="190" height="35" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    
    <!-- Film DTF despegándose con diseño brillante -->
    <path d="M40 100 L180 80 Q200 40 160 30 L50 60 Z" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <!-- Diseño estampado brillante sobre la prenda -->
    <rect x="50" y="115" width="140" height="24" rx="4" fill="url(#neonDtf)"/>
    
    <!-- Termostato / indicador 160°C -->
    <rect x="85" y="180" width="70" height="22" rx="11" fill="rgba(244, 63, 94, 0.2)" stroke="#f43f5e" stroke-width="1"/>
    <text x="120" y="195" text-anchor="middle" fill="#fb7185" font-family="monospace" font-size="10" font-weight="bold">160°C • 15s</text>
  </g>

  <!-- Botón Play central con brillo -->
  <circle cx="180" cy="210" r="32" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <polygon points="174,196 194,210 174,224" fill="#ffffff"/>

  <!-- Badge superior de Instagram Reel -->
  <g transform="translate(16, 16)">
    <rect width="90" height="28" rx="14" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)"/>
    <text x="45" y="18" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">▶ REEL</text>
  </g>

  <!-- Pie del Reel -->
  <rect x="0" y="380" width="360" height="100" rx="16" fill="linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.85) 100%)"/>
  <text x="20" y="420" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Despegue de DTF en frío 🔥</text>
  <text x="20" y="442" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">@serendipiacreaciones.cl • Máxima elasticidad</text>
</svg>
