<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="reelGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b2b" />
      <stop offset="50%" stop-color="#2d124d" />
      <stop offset="100%" stop-color="#0f071a" />
    </linearGradient>
    <linearGradient id="igGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f09433" />
      <stop offset="25%" stop-color="#e6683c" />
      <stop offset="50%" stop-color="#dc2743" />
      <stop offset="75%" stop-color="#cc2366" />
      <stop offset="100%" stop-color="#bc1888" />
    </linearGradient>
  </defs>

  <!-- Fondo tipo Reel vertical -->
  <rect width="360" height="480" rx="16" fill="url(#reelGrad1)"/>
  
  <!-- Trama técnica / bastidor de bordado -->
  <circle cx="180" cy="210" r="120" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>
  <circle cx="180" cy="210" r="95" stroke="rgba(236, 72, 153, 0.25)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Cabezal de bordadora en movimiento hacia el centro -->
  <g transform="translate(135, 120)">
    <rect x="35" y="0" width="20" height="55" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
    <polygon points="45,55 42,75 48,75" fill="#f8fafc"/>
    <!-- Hilo de bordado bajando -->
    <path d="M45 10 Q65 40 45 75" stroke="#ec4899" stroke-width="2" fill="none"/>
    <!-- Escudo bordándose -->
    <path d="M15 80 L75 80 L65 140 L45 155 L25 140 Z" fill="rgba(139, 92, 246, 0.3)" stroke="#8b5cf6" stroke-width="2"/>
    <text x="45" y="115" text-anchor="middle" fill="#fbcfe8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold">SC</text>
  </g>

  <!-- Botón Play central con brillo -->
  <circle cx="180" cy="210" r="32" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <polygon points="174,196 194,210 174,224" fill="#ffffff"/>

  <!-- Badge superior de Instagram Reel -->
  <g transform="translate(16, 16)">
    <rect width="90" height="28" rx="14" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)"/>
    <path d="M14 14m-5 0a5 5 0 1 0 10 0a5 5 0 1 0 -10 0" stroke="url(#igGlow)" stroke-width="1.5" fill="none"/>
    <text x="24" y="18" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">REEL</text>
  </g>

  <!-- Datos y pie del Reel -->
  <rect x="0" y="380" width="360" height="100" rx="16" fill="linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.85) 100%)"/>
  <text x="20" y="420" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Bordado computarizado en vivo 🧵</text>
  <text x="20" y="442" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">@serendipiacreaciones.cl • 15.000 puntadas</text>
</svg>
