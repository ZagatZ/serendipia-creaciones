<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="reelGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1b33" />
      <stop offset="50%" stop-color="#142c54" />
      <stop offset="100%" stop-color="#07101f" />
    </linearGradient>
  </defs>

  <rect width="360" height="480" rx="16" fill="url(#reelGrad3)"/>

  <!-- Costura overlock y armado de buzos -->
  <g transform="translate(100, 110)">
    <path d="M20 50 L80 20 L140 50 L120 160 L40 160 Z" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <line x1="80" y1="20" x2="80" y2="160" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="80" cy="80" r="16" fill="#fbbf24"/>
    <text x="80" y="84" text-anchor="middle" fill="#78350f" font-size="10" font-weight="bold">COL</text>
  </g>

  <!-- Botón Play central con brillo -->
  <circle cx="180" cy="210" r="32" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <polygon points="174,196 194,210 174,224" fill="#ffffff"/>

  <!-- Badge superior de Instagram Reel -->
  <g transform="translate(16, 16)">
    <rect width="90" height="28" rx="14" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)"/>
    <text x="45" y="18" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">▶ REEL</text>
  </g>

  <!-- Pie del Reel -->
  <rect x="0" y="380" width="360" height="100" rx="16" fill="linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.85) 100%)"/>
  <text x="20" y="420" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Confección de Buzos Escolares 🎓</text>
  <text x="20" y="442" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">@serendipiacreaciones.cl • Frisa antipilling</text>
</svg>
