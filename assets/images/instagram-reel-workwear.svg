<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="reelGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f291e" />
      <stop offset="50%" stop-color="#143d2c" />
      <stop offset="100%" stop-color="#081711" />
    </linearGradient>
  </defs>

  <rect width="360" height="480" rx="16" fill="url(#reelGrad4)"/>

  <!-- Chaleco / Chaqueta industrial con cinta reflectiva -->
  <g transform="translate(100, 110)">
    <path d="M20 40 L80 15 L140 40 L130 160 L30 160 Z" fill="#15803d" stroke="#22c55e" stroke-width="2"/>
    <rect x="25" y="80" width="110" height="14" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="28" y="120" width="104" height="14" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="80" y1="15" x2="80" y2="160" stroke="#166534" stroke-width="2"/>
  </g>

  <!-- Botón Play central con brillo -->
  <circle cx="180" cy="210" r="32" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <polygon points="174,196 194,210 174,224" fill="#ffffff"/>

  <!-- Badge superior de Instagram Reel -->
  <g transform="translate(16, 16)">
    <rect width="90" height="28" rx="14" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)"/>
    <text x="45" y="18" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">▶ REEL</text>
  </g>

  <!-- Pie del Reel -->
  <rect x="0" y="380" width="360" height="100" rx="16" fill="linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.85) 100%)"/>
  <text x="20" y="420" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Ropa de Trabajo y Seguridad 🦺</text>
  <text x="20" y="442" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">@serendipiacreaciones.cl • Cintas reflectivas</text>
</svg>
