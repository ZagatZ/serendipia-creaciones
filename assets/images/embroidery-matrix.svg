<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="emBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1d183b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </radialGradient>
    <pattern id="emGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148, 163, 184, 0.08)" stroke-width="1"/>
    </pattern>
    <linearGradient id="hoopRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f05cae"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#00b0d0"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="emShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="400" height="260" fill="url(#emBg)"/>
  <rect width="400" height="260" fill="url(#emGrid)"/>

  <!-- Ejes sutiles de digitalización -->
  <line x1="40" y1="134" x2="360" y2="134" stroke="#00b0d0" stroke-opacity="0.18" stroke-dasharray="4 4"/>
  <line x1="200" y1="18" x2="200" y2="246" stroke="#e33391" stroke-opacity="0.18" stroke-dasharray="4 4"/>

  <!-- Bastidor de Bordado Industrial -->
  <g filter="url(#emShadow)">
    <!-- Tornillo tensor superior del bastidor -->
    <rect x="190" y="16" width="20" height="14" rx="3" fill="#334155" stroke="#64748b" stroke-width="1.2"/>
    <rect x="184" y="20" width="32" height="5" rx="2.5" fill="#94a3b8"/>
    <circle cx="200" cy="22.5" r="2.2" fill="#0f172a"/>

    <!-- Aro exterior e interior del bastidor -->
    <circle cx="200" cy="134" r="98" fill="url(#hoopRing)" stroke="#64748b" stroke-width="2"/>
    <circle cx="200" cy="134" r="88" fill="#0c1322" stroke="#334155" stroke-width="1.5"/>

    <!-- Textura tela tensada dentro del bastidor -->
    <circle cx="200" cy="134" r="86" fill="url(#emGrid)" opacity="0.9"/>

    <!-- Escudo bordado con puntadas satinadas y tatami -->
    <g transform="translate(200, 134)">
      <!-- Sombra del parche bordado -->
      <path d="M 0 -54 L 46 -36 V 8 C 46 38, 0 58, 0 58 C 0 58, -46 38, -46 8 V -36 Z"
            fill="#000000" opacity="0.45" transform="translate(0, 4)"/>
      <!-- Base del escudo -->
      <path d="M 0 -54 L 46 -36 V 8 C 46 38, 0 58, 0 58 C 0 58, -46 38, -46 8 V -36 Z"
            fill="url(#shieldFill)" stroke="url(#shieldBorder)" stroke-width="4.5" stroke-linejoin="round"/>
      <!-- Borde interior pespunte -->
      <path d="M 0 -46 L 38 -31 V 7 C 38 32, 0 49, 0 49 C 0 49, -38 32, -38 7 V -31 Z"
            fill="none" stroke="#cbd5e1" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="3 2.5"/>

      <!-- Puntadas tatami diagonales sutiles -->
      <g stroke="#8b5cf6" stroke-opacity="0.28" stroke-width="1.5" stroke-linecap="round">
        <line x1="-30" y1="-22" x2="30" y2="-22"/>
        <line x1="-32" y1="-13" x2="32" y2="-13"/>
        <line x1="-33" y1="-4" x2="33" y2="-4"/>
        <line x1="-32" y1="5" x2="32" y2="5"/>
        <line x1="-28" y1="14" x2="28" y2="14"/>
        <line x1="-22" y1="23" x2="22" y2="23"/>
        <line x1="-14" y1="32" x2="14" y2="32"/>
      </g>

      <!-- Corona dorada bordada al centro -->
      <path d="M -22 10 L -16 -14 L 0 -1 L 16 -14 L 22 10 Z"
            fill="url(#crownGold)" stroke="#fef08a" stroke-width="1.2" stroke-linejoin="round"/>
      <rect x="-22" y="13" width="44" height="5" rx="2.5" fill="url(#crownGold)"/>
      <circle cx="-16" cy="-18" r="2.8" fill="#fef08a"/>
      <circle cx="0" cy="-6" r="3" fill="#fef08a"/>
      <circle cx="16" cy="-18" r="2.8" fill="#fef08a"/>

      <!-- Nodos vectoriales de digitalización (toque Wilcom) -->
      <rect x="-49" y="-39" width="6" height="6" fill="#00b0d0" stroke="#ffffff" stroke-width="1"/>
      <rect x="43" y="-39" width="6" height="6" fill="#00b0d0" stroke="#ffffff" stroke-width="1"/>
      <rect x="-3" y="-57" width="6" height="6" fill="#e33391" stroke="#ffffff" stroke-width="1"/>
      <rect x="-3" y="55" width="6" height="6" fill="#e33391" stroke="#ffffff" stroke-width="1"/>
    </g>
  </g>
</svg>
