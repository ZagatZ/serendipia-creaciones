<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="wbStudio" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#11273a"/>
      <stop offset="60%" stop-color="#0b1424"/>
      <stop offset="100%" stop-color="#060a12"/>
    </radialGradient>
    <linearGradient id="wbDark" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#273549"/>
      <stop offset="50%" stop-color="#152033"/>
      <stop offset="100%" stop-color="#0c1322"/>
    </linearGradient>
    <linearGradient id="wbUpper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="wbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="400" height="260" fill="url(#wbStudio)"/>
  <ellipse cx="200" cy="128" rx="160" ry="95" fill="#00b0d0" opacity="0.12"/>
  <ellipse cx="200" cy="240" rx="108" ry="8" fill="#000000" opacity="0.45"/>

  <!-- Chaqueta Cortaviento Técnica Impermeable -->
  <g filter="url(#wbShadow)">
    <!-- Capucha posterior integrada -->
    <path d="M 164 42 C 174 18, 226 18, 236 42 Z" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>

    <!-- Manga Izquierda -->
    <path d="M 134 52 C 108 60, 86 94, 72 180 L 96 186 C 109 138, 122 110, 136 102 Z"
          fill="url(#wbDark)" stroke="#475569" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Puño elástico -->
    <path d="M 72 180 L 96 186 L 94 195 L 71 189 Z" fill="#0f172a" stroke="#33c9e6" stroke-width="1"/>

    <!-- Manga Derecha -->
    <path d="M 266 52 C 292 60, 314 94, 328 180 L 304 186 C 291 138, 278 110, 264 102 Z"
          fill="url(#wbDark)" stroke="#475569" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Puño elástico -->
    <path d="M 328 180 L 304 186 L 306 195 L 329 189 Z" fill="#0f172a" stroke="#33c9e6" stroke-width="1"/>

    <!-- Cuerpo Principal -->
    <path d="M 134 52 C 156 42, 244 42, 266 52 L 266 220 C 240 227, 160 227, 134 220 Z"
          fill="url(#wbDark)" stroke="#475569" stroke-width="1.3" stroke-linejoin="round"/>

    <!-- Panel Chevron Superior Técnico -->
    <path d="M 134 52 C 156 42, 244 42, 266 52 L 265 104 L 200 124 L 135 104 Z"
          fill="url(#wbUpper)"/>
    <!-- Costura termosellada reflectiva en V -->
    <path d="M 135 104 L 200 124 L 265 104" stroke="#33c9e6" stroke-width="2" stroke-linecap="round"/>

    <!-- Cuello alto cortaviento -->
    <path d="M 168 44 C 180 34, 220 34, 232 44 L 230 60 C 214 66, 186 66, 170 60 Z"
          fill="#1e293b" stroke="#64748b" stroke-width="1.3"/>

    <!-- Cierre central impermeable sellado -->
    <line x1="200" y1="54" x2="200" y2="224" stroke="#33c9e6" stroke-width="2.6"/>
    <rect x="197" y="64" width="6" height="11" rx="2" fill="#f8fafc"/>

    <!-- Bolsillos con cierre sellado -->
    <line x1="148" y1="158" x2="164" y2="192" stroke="#33c9e6" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="252" y1="158" x2="236" y2="192" stroke="#33c9e6" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Logo corporativo bordado en pecho -->
    <g transform="translate(226, 82)">
      <rect x="-10" y="-10" width="20" height="20" rx="5" fill="#0f172a" stroke="#33c9e6" stroke-width="1.4"/>
      <path d="M -4 3 L 0 -5 L 4 3 Z" fill="#e33391"/>
    </g>

    <!-- Dobladillo inferior con cordón ajustable -->
    <path d="M 134 214 C 160 221, 240 221, 266 214" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 2"/>
  </g>
</svg>
