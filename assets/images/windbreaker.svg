<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="wbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1120" />
      <stop offset="100%" stop-color="#111c33" />
    </linearGradient>
    <linearGradient id="wbFabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33c9e6" />
      <stop offset="100%" stop-color="#00b0d0" />
    </linearGradient>
    <linearGradient id="magentaAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f05cae" />
      <stop offset="100%" stop-color="#e33391" />
    </linearGradient>
  </defs>

  <rect width="400" height="260" rx="16" fill="url(#wbBg)"/>

  <!-- Cuadrícula técnica textil de fondo -->
  <line x1="20" y1="130" x2="380" y2="130" stroke="rgba(255,255,255,0.06)" stroke-dasharray="4 4"/>
  <line x1="200" y1="20" x2="200" y2="240" stroke="rgba(255,255,255,0.06)" stroke-dasharray="4 4"/>

  <!-- Chaqueta Cortaviento Técnica -->
  <g transform="translate(105, 20)">
    <!-- Cuerpo y Mangas impermeables -->
    <path d="M50 45 L10 85 L32 125 L56 102 V200 H134 V102 L158 125 L180 85 L140 45 Z" 
          fill="url(#wbFabric)" 
          stroke="#334155" 
          stroke-width="2"/>
    
    <!-- Cuello alto con capucha integrada -->
    <path d="M50 45 Q95 28 140 45 L135 60 Q95 48 55 60 Z" fill="#334155" stroke="#475569" stroke-width="1.5"/>

    <!-- Paneles de contraste en hombros y pecho (Cyan & Magenta Serendipia) -->
    <path d="M50 45 L95 55 L95 85 L56 102 Z" fill="rgba(0, 176, 208, 0.25)" stroke="#00b0d0" stroke-width="1.2"/>
    <path d="M140 45 L95 55 L95 85 L134 102 Z" fill="rgba(227, 51, 145, 0.25)" stroke="#e33391" stroke-width="1.2"/>

    <!-- Cierre central impermeable sellado -->
    <line x1="95" y1="52" x2="95" y2="200" stroke="#00b0d0" stroke-width="3"/>
    <rect x="92" y="70" width="6" height="12" rx="2" fill="#f8fafc"/>

    <!-- Costuras termoselladas -->
    <path d="M56 102 L95 108 L134 102" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Bolsillos laterales con cierre -->
    <line x1="68" y1="150" x2="82" y2="175" stroke="#00b0d0" stroke-width="2" stroke-linecap="round"/>
    <line x1="122" y1="150" x2="108" y2="175" stroke="#e33391" stroke-width="2" stroke-linecap="round"/>

    <!-- Logo / Escudo bordado en el pecho izquierdo -->
    <rect x="68" y="72" width="18" height="18" rx="4" fill="#0f172a" stroke="#00b0d0" stroke-width="1.2"/>
    <circle cx="77" cy="81" r="5" fill="#e33391"/>

    <!-- Pretina y puños elásticos ajustables -->
    <rect x="56" y="194" width="78" height="8" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect x="12" y="80" width="12" height="7" rx="1" fill="#1e293b" stroke="#475569" stroke-width="1" transform="rotate(-30 12 80)"/>
    <rect x="168" y="75" width="12" height="7" rx="1" fill="#1e293b" stroke="#475569" stroke-width="1" transform="rotate(30 168 75)"/>
  </g>

  <!-- Tag de prenda técnica -->
  <rect x="20" y="20" width="155" height="42" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(0, 176, 208, 0.35)"/>
  <text x="30" y="38" fill="#33c9e6" font-family="monospace" font-size="10" font-weight="bold">CHAQUETA CORTAVIENTO</text>
  <text x="30" y="51" fill="#94a3b8" font-family="monospace" font-size="9">Impermeable • Bordado / DTF</text>

  <!-- Sello de durabilidad térmica -->
  <g transform="translate(235, 205)">
    <rect width="145" height="34" rx="17" fill="rgba(0, 176, 208, 0.15)" stroke="#00b0d0" stroke-width="1"/>
    <text x="72" y="21" text-anchor="middle" fill="#67e8f9" font-family="sans-serif" font-size="11" font-weight="600">Tela Cortaviento &amp; Forro</text>
  </g>
</svg>
